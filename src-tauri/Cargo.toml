[package]
name = "passkeeper"
version = "1.0.0"
description = "Manager for passwords"
authors = ["Kwangsoo Seo", "monoslab <chps74@naver.com>"]
edition = "2024"
# Get rust version : rustc --version
# rustc 1.96.0 (ac68faa20 2026-05-25)
rust-version = "1.96.0"
build = "build.rs"
license = "Copyright (C) 2025 Monoslab. All rights reserved."
readme = "README_KO.md"

[package.metadata.tauri-winres]
OriginalFilename = "PassKeeper.exe"
LegalCopyright = "Copyright (C) 2025 Monoslab. All rights reserved."
FileDescription = "Manager for passwords"
ProductName = "passkeeper"
CompanyName = "Monoslab"
ProductVersion = "1.0.0"
FileVersion = "1.0.0"
Comments = "passkeeper"
InternalName = "PassKeeper.exe"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "passkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3.6"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
once_cell = "1.21.4"
# Below are dependencies for encryption/decryption and hashing
# For AES encryption
#aes = "0.9.1"
#cbc = "0.2.1"
#block-padding = "0.4.2"
# For SHA256 hashing
#sha2 = "0.11.0"
# Hexadecimal literal support
#hex = "0.4.3"
#hex-literal = "1.1.0"
# Base64 encoding/decoding
base64 = "0.22.1"
common = { version = "1.0.0", path = "src/common" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[features]
default = []
mobile = []

[workspace]
members = [ "src/common" ]